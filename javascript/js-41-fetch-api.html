<!DOCTYPE html>
<html>
<head>
    <title>Fetch API</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        .box {
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
        }

        #result {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>

<body>

    <h1>Fetch API Example</h1>

    <div class="box">

        <button onclick="getData()">Fetch Data</button>

        <div id="result"></div>

    </div>

    <script>

        function getData() {

            fetch("https://jsonplaceholder.typicode.com/users/1")

                .then(function(response) {
                    return response.json();
                })

                .then(function(data) {

                    document.getElementById("result").innerHTML =
                        "<b>Name:</b> " + data.name + "<br>" +
                        "<b>Email:</b> " + data.email + "<br>" +
                        "<b>Phone:</b> " + data.phone;

                })

                .catch(function(error) {

                    document.getElementById("result").innerHTML =
                        "Error fetching data.";

                });
        }

    </script>

</body>
</html>
