
<!DOCTYPE html>
<html>
<head>
    <title>Remove Duplicate Elements</title>
</head>
<body>

    <h1>Remove Duplicate Elements from an Array</h1>

    <label>Enter array elements:</label>
    <input type="text" id="arrayInput"
           placeholder="10, 20, 10, 30, 20, 40">

    <br><br>

    <button onclick="removeDuplicates()">Remove Duplicates</button>

    <h3 id="result"></h3>

    <script>
        function removeDuplicates() {
            let input = document.getElementById("arrayInput").value;

            let arr = input.split(",").map(function(item) {
                return item.trim();
            });

            let uniqueArray = [...new Set(arr)];

            document.getElementById("result").innerHTML =
                "Original Array: " + arr.join(", ") +
                "<br><br>" +
                "Array without duplicates: " + uniqueArray.join(", ");
        }
    </script>

</body>
</html>
