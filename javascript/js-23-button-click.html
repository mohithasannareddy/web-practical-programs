<!DOCTYPE html>
<html>
<head>
    <title>Button Click Event</title>
</head>
<body>

    <h1>Button Click Event</h1>

    <p id="message">Click the button</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML = "Button Clicked Successfully!";
        }
    </script>

</body>
</html>
