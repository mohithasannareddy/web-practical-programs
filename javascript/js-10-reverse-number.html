<!DOCTYPE html>
<html>
<head>
    <title>Reverse a Number</title>
</head>
<body>

    <h1>Reverse a Number</h1>

    <script>
        let number = 12345;
        let original = number;
        let reverse = 0;

        while (number > 0) {
            let digit = number % 10;
            reverse = reverse * 10 + digit;
            number = Math.floor(number / 10);
        }

        document.write("Original Number: " + original + "<br>");
        document.write("Reversed Number: " + reverse);
    </script>

</body>
</html>
