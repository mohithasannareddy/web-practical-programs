<!DOCTYPE html>
<html>
<head>
    <title>Strings and String Methods</title>
</head>
<body>

    <h1>Strings and String Methods</h1>

    <script>
        let text = "Hello JavaScript";

        document.write("Original String: " + text + "<br><br>");

        document.write("Length: " + text.length + "<br>");
        document.write("Uppercase: " + text.toUpperCase() + "<br>");
        document.write("Lowercase: " + text.toLowerCase() + "<br>");
        document.write("Character at index 1: " + text.charAt(1) + "<br>");
        document.write("Substring: " + text.substring(0, 5) + "<br>");
        document.write("Replace: " + text.replace("JavaScript", "World"));
    </script>

</body>
</html>
