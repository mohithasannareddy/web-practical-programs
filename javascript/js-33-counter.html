<!DOCTYPE html>
<html>
<head>
    <title>Counter Application</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #count {
            font-size: 50px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Counter Application</h1>

    <div id="count">0</div>

    <button onclick="decrement()">Decrement</button>
    <button onclick="increment()">Increment</button>

    <script>
        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").innerHTML = count;
        }

        function decrement() {
            count--;
            document.getElementById("count").innerHTML = count;
        }
    </script>

</body>
</html>
