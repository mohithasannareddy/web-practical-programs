<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Objects</title>
</head>
<body>

    <h1>Objects in JavaScript</h1>

    <script>
        let student = {
            name: "Mohitha",
            age: 19,
            course: "CSE",
            college: "Sai University"
        };

        document.write("Student Details<br><br>");

        document.write("Name: " + student.name + "<br>");
        document.write("Age: " + student.age + "<br>");
        document.write("Course: " + student.course + "<br>");
        document.write("College: " + student.college);
    </script>

</body>
</html>
