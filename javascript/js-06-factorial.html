<!DOCTYPE html>
<html>
<head>
    <title>Factorial of a Number</title>
</head>
<body>

    <h1>Factorial of a Number</h1>

    <script>
        let number = 5;
        let factorial = 1;

        for (let i = 1; i <= number; i++) {
            factorial = factorial * i;
        }

        document.write("Number: " + number + "<br>");
        document.write("Factorial: " + factorial);
    </script>

</body>
</html>
