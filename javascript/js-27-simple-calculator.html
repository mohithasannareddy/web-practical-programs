<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        .calculator {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            font-size: 18px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Simple Calculator</h1>

    <div class="calculator">

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <br>

        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">-</button>
        <button onclick="calculate('*')">*</button>
        <button onclick="calculate('/')">/</button>

        <div id="result">Result: </div>

    </div>

    <script>
        function calculate(operator) {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            let result;

            if (operator === "+") {
                result = num1 + num2;
            }
            else if (operator === "-") {
                result = num1 - num2;
            }
            else if (operator === "*") {
                result = num1 * num2;
            }
            else if (operator === "/") {
                if (num2 === 0) {
                    result = "Cannot divide by zero";
                }
                else {
                    result = num1 / num2;
                }
            }

            document.getElementById("result").innerHTML =
                "Result: " + result;
        }
    </script>

</body>
</html>
