
<!DOCTYPE html>
<html>
<head>
    <title>Character Frequency</title>
</head>
<body>

    <h1>Frequency of Characters in a String</h1>

    <label>Enter a string:</label>
    <br><br>

    <textarea id="textInput" rows="4" cols="40"
        placeholder="Enter your string"></textarea>

    <br><br>

    <button onclick="findFrequency()">Find Frequency</button>

    <h3>Result:</h3>
    <div id="result"></div>

    <script>
        function findFrequency() {
            let text = document.getElementById("textInput").value;

            let frequency = {};

            for (let i = 0; i < text.length; i++) {
                let character = text[i];

                // Ignore spaces
                if (character === " ") {
                    continue;
                }

                character = character.toLowerCase();

                if (frequency[character]) {
                    frequency[character]++;
                } else {
                    frequency[character] = 1;
                }
            }

            let output = "";

            for (let character in frequency) {
                output += character + " : " +
                          frequency[character] +
                          " time(s)<br>";
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>

</body>
</html>
