<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #timer {
            font-size: 50px;
            font-weight: bold;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Countdown Timer</h1>

    <input type="number" id="secondsInput"
           placeholder="Enter seconds" min="1">

    <br>

    <button onclick="startTimer()">Start</button>
    <button onclick="resetTimer()">Reset</button>

    <div id="timer">00</div>

    <script>
        let timeLeft = 0;
        let countdown = null;

        function startTimer() {

            if (countdown !== null) {
                return;
            }

            timeLeft = Number(
                document.getElementById("secondsInput").value
            );

            if (timeLeft <= 0) {
                alert("Please enter a valid number of seconds.");
                return;
            }

            document.getElementById("timer").innerHTML = timeLeft;

            countdown = setInterval(function() {

                timeLeft--;

                document.getElementById("timer").innerHTML = timeLeft;

                if (timeLeft === 0) {
                    clearInterval(countdown);
                    countdown = null;
                    alert("Time is up!");
                }

            }, 1000);
        }

        function resetTimer() {

            clearInterval(countdown);

            countdown = null;
            timeLeft = 0;

            document.getElementById("timer").innerHTML = "00";
            document.getElementById("secondsInput").value = "";
        }
    </script>

</body>
</html>
