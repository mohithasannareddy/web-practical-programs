<!DOCTYPE html>
<html>
<head>
    <title>Classes and Objects</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        .box {
            width: 350px;
            margin: auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Classes and Objects</h1>

    <div class="box" id="output"></div>

    <script>

        // Creating a class
        class Student {

            constructor(name, branch, year) {
                this.name = name;
                this.branch = branch;
                this.year = year;
            }

            displayDetails() {
                return `
                    Name: ${this.name}<br>
                    Branch: ${this.branch}<br>
                    Year: ${this.year}
                `;
            }
        }

        // Creating an object
        let student1 = new Student("Mohitha", "CSE", 2);

        // Display object details
        document.getElementById("output").innerHTML =
            student1.displayDetails();

    </script>

</body>
</html>
