<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>
<body>

    <h1>Even or Odd</h1>

    <script>
        let number = 25;

        if (number % 2 == 0) {
            document.write(number + " is Even");
        } else {
            document.write(number + " is Odd");
        }
    </script>

</body>
</html>
