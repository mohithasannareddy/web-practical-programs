<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>
<body>

    <h1>Fibonacci Series</h1>

    <script>
        let n = 10;
        let a = 0;
        let b = 1;

        document.write("Fibonacci Series: ");

        for (let i = 1; i <= n; i++) {
            document.write(a + " ");

            let next = a + b;
            a = b;
            b = next;
        }
    </script>

</body>
</html>
