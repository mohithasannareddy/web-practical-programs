<!DOCTYPE html>
<html>
<head>
    <title>Arrow Functions</title>
</head>
<body>

    <h1>JavaScript Arrow Functions</h1>

    <script>
        const add = (a, b) => {
            return a + b;
        };

        const multiply = (a, b) => a * b;

        let x = 10;
        let y = 5;

        document.write("First Number: " + x + "<br>");
        document.write("Second Number: " + y + "<br><br>");

        document.write("Addition: " + add(x, y) + "<br>");
        document.write("Multiplication: " + multiply(x, y));
    </script>

</body>
</html>
