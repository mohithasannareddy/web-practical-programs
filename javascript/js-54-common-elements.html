
<!DOCTYPE html>
<html>
<head>
    <title>Common Elements</title>
</head>
<body>

    <h1>Common Elements in Two Arrays</h1>

    <label>Enter first array:</label>
    <input type="text" id="array1" placeholder="1, 2, 3, 4, 5">

    <br><br>

    <label>Enter second array:</label>
    <input type="text" id="array2" placeholder="3, 4, 5, 6, 7">

    <br><br>

    <button onclick="findCommon()">Find Common Elements</button>

    <h3 id="result"></h3>

    <script>
        function findCommon() {
            let input1 = document.getElementById("array1").value;
            let input2 = document.getElementById("array2").value;

            let arr1 = input1.split(",").map(function(item) {
                return item.trim();
            });

            let arr2 = input2.split(",").map(function(item) {
                return item.trim();
            });

            let common = [];

            for (let i = 0; i < arr1.length; i++) {
                if (arr2.includes(arr1[i]) && !common.includes(arr1[i])) {
                    common.push(arr1[i]);
                }
            }

            if (common.length > 0) {
                document.getElementById("result").innerHTML =
                    "Common Elements: " + common.join(", ");
            } else {
                document.getElementById("result").innerHTML =
                    "No common elements found.";
            }
        }
    </script>

</body>
</html>
