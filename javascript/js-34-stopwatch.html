<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #display {
            font-size: 50px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <button onclick="startStopwatch()">Start</button>
    <button onclick="stopStopwatch()">Stop</button>
    <button onclick="resetStopwatch()">Reset</button>

    <script>
        let seconds = 0;
        let minutes = 0;
        let hours = 0;
        let timer = null;

        function updateDisplay() {

            let h = String(hours).padStart(2, "0");
            let m = String(minutes).padStart(2, "0");
            let s = String(seconds).padStart(2, "0");

            document.getElementById("display").innerHTML =
                h + ":" + m + ":" + s;
        }

        function startStopwatch() {

            if (timer !== null) {
                return;
            }

            timer = setInterval(function () {

                seconds++;

                if (seconds === 60) {
                    seconds = 0;
                    minutes++;
                }

                if (minutes === 60) {
                    minutes = 0;
                    hours++;
                }

                updateDisplay();

            }, 1000);
        }

        function stopStopwatch() {
            clearInterval(timer);
            timer = null;
        }

        function resetStopwatch() {

            clearInterval(timer);

            timer = null;
            seconds = 0;
            minutes = 0;
            hours = 0;

            updateDisplay();
        }
    </script>

</body>
</html>
