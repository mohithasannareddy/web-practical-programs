
<!DOCTYPE html>
<html>
<head>
    <title>CSS Variables</title>

    <style>
        :root {
            --main-color: #2563eb;
            --text-color: white;
            --card-color: #e0f2fe;
            --spacing: 20px;
        }

        body {
            font-family: Arial;
            text-align: center;
            background-color: var(--card-color);
        }

        h1 {
            color: var(--main-color);
        }

        .card {
            width: 300px;
            margin: 30px auto;
            padding: var(--spacing);
            background-color: var(--main-color);
            color: var(--text-color);
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <h1>CSS Variables</h1>

    <div class="card">
        <h2>Reusable Values</h2>
        <p>This design uses CSS custom properties.</p>
    </div>

</body>
</html>
