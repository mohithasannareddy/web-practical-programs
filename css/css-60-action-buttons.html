
<!DOCTYPE html>
<html>
<head>
    <title>Action Buttons</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .icon {
            font-size: 25px;
            padding: 12px 15px;
        }
    </style>
</head>

<body>

    <h1>Action Buttons</h1>

    <button>Save</button>

    <button>Download</button>

    <button class="icon">✏️</button>

    <button class="icon">🗑️</button>

    <button class="icon">❤️</button>

</body>
</html>
