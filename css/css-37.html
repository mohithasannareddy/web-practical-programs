<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaaS Sidebar Navigation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #171b2d;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .menu a {
            display: block;
            color: #d8dbea;
            text-decoration: none;
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 10px;
        }

        .menu a:hover {
            background: #4f46e5;
            color: white;
        }

        .menu .active {
            background: #4f46e5;
            color: white;
        }

        /* Main Content */
        .main {
            margin-left: 240px;
            padding: 50px;
        }

        .main h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .main p {
            color: #666;
            line-height: 1.6;
        }

        /* Cards */
        .cards {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 35px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #4f46e5;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        /* Mobile */
        @media (max-width: 700px) {

            .sidebar {
                width: 180px;
            }

            .main {
                margin-left: 180px;
                padding: 25px;
            }

            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            CloudFlow
        </div>

        <div class="menu">

            <a href="#" class="active">Dashboard</a>

            <a href="#">Projects</a>

            <a href="#">Tasks</a>

            <a href="#">Team</a>

            <a href="#">Messages</a>

            <a href="#">Settings</a>

            <a href="../index.html">Home</a>

        </div>

    </aside>

    <!-- Main Content -->
    <main class="main">

        <h1>Dashboard</h1>

        <p>
            Welcome to your SaaS dashboard.
            Manage projects, tasks, and your team from the sidebar.
        </p>

        <div class="cards">

            <div class="card">
                <h3>Projects</h3>
                <div class="number">12</div>
                <p>Active projects</p>
            </div>

            <div class="card">
                <h3>Tasks</h3>
                <div class="number">48</div>
                <p>Tasks completed</p>
            </div>

            <div class="card">
                <h3>Team</h3>
                <div class="number">08</div>
                <p>Team members</p>
            </div>

        </div>

    </main>

</body>
</html>
