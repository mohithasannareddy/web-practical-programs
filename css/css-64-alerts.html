
<!DOCTYPE html>
<html>
<head>
    <title>Alerts</title>

    <style>
        body {
            font-family: Arial;
            padding: 50px;
            background: #f8fafc;
        }

        .alert {
            padding: 18px;
            margin: 15px auto;
            max-width: 600px;
            border-radius: 10px;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

    <h1>Alert Components</h1>

    <div class="alert info">ℹ️ Information message</div>

    <div class="alert success">✓ Operation successful</div>

    <div class="alert warning">⚠️ Warning message</div>

    <div class="alert danger">✕ Something went wrong</div>

</body>
</html>
