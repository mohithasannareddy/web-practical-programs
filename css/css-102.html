<!DOCTYPE html>
<html>
<head>
    <title>Conversion Funnel Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .funnel {
            width: 80%;
            max-width: 700px;
            margin: 40px auto;
        }

        .step {
            color: white;
            text-align: center;
            padding: 18px;
            margin: 8px auto;
            border-radius: 8px;
            font-weight: bold;
        }

        .step1 {
            width: 100%;
            background: #2563eb;
        }

        .step2 {
            width: 80%;
            background: #3b82f6;
        }

        .step3 {
            width: 60%;
            background: #60a5fa;
        }

        .step4 {
            width: 40%;
            background: #93c5fd;
            color: #222;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Conversion Funnel Dashboard</h1>

    <div class="funnel">

        <div class="step step1">
            Visitors - 10,000
        </div>

        <div class="step step2">
            Sign Ups - 8,000
        </div>

        <div class="step step3">
            Trial Users - 6,000
        </div>

        <div class="step step4">
            Customers - 4,000
        </div>

    </div>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
