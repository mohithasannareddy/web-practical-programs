            padding-left: 10px;

        .program-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;

            list-style: none;
        }

        .program-list li {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;
            transition: 0.3s;
            overflow: hidden;
        }

        .program-list li:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .program-list a {
            display: flex;
            align-items: center;

            padding: 18px;

            color: #e2e8f0;
            text-decoration: none;

            line-height: 1.5;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 38px;

            border-radius: 50%;

        const programList = document.getElementById("programList");

        programs.forEach(function(program, index) {

            const number = index + 1;

            const li = document.createElement("li");

            const link = document.createElement("a");

            /*
                If your files are named:
                css-001.html
                css-002.html
                css-003.html
                etc.
            */

            link.href = "css-" + String(number).padStart(3, "0") + ".html";

            const numberSpan = document.createElement("span");

            numberSpan.className = "number";

            numberSpan.textContent = number;

            link.appendChild(numberSpan);

            link.appendChild(
                document.createTextNode(program)
            );

            li.appendChild(link);

            programList.appendChild(li);

        });


        /* ==============================
           SEARCH FUNCTION
        ============================== */

        function searchPrograms() {

            const searchText =
                document.getElementById("search").value.toLowerCase().trim();

            const items =
                document.querySelectorAll("#programList li");

            items.forEach(function(item) {

                const text =
                    item.textContent.toLowerCase();

                if (text.includes(searchText)) {

                    item.style.display = "";

                } else {

                    item.style.display = "none";

                }

            });

        }
