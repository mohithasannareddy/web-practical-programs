
<!DOCTYPE html>
<html>
<head>
    <title>CSS Borders</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f5f7fb;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            width: 80%;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        .solid {
            border-style: solid;
            border-width: 4px;
            border-color: red;
            padding: 15px;
            margin: 15px;
        }

        .dashed {
            border-style: dashed;
            border-width: 4px;
            border-color: blue;
            padding: 15px;
            margin: 15px;
        }

        .dotted {
            border-style: dotted;
            border-width: 4px;
            border-color: green;
            padding: 15px;
            margin: 15px;
        }

        .double {
            border-style: double;
            border-width: 6px;
            border-color: purple;
            padding: 15px;
            margin: 15px;
        }

        .rounded {
            border: 4px solid orange;
            border-radius: 20px;
            padding: 15px;
            margin: 15px;
        }

        nav {
            text-align: center;
            margin: 25px;
        }

        nav a {
            text-decoration: none;
            background-color: black;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: darkblue;
        }

    </style>
</head>

<body>

    <h1>CSS Border Properties</h1>

    <div class="box">

        <h2>Different Border Styles</h2>

        <div class="solid">
            Solid Border
        </div>

        <div class="dashed">
            Dashed Border
        </div>

        <div class="dotted">
            Dotted Border
        </div>

        <div class="double">
            Double Border
        </div>

        <div class="rounded">
            Rounded Border using border-radius
        </div>

    </div>

    <nav>
        <a href="../index.html">ðŸ  Home</a>
        <a href="index.html">ðŸŽ¨ CSS Programs</a>
    </nav>

</body>
</html>
