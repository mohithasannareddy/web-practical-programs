
<!DOCTYPE html>
<html>
<head>
    <title>Popover</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 80px;
        }

        .container {
            position: relative;
            display: inline-block;
        }

        button {
            padding: 12px 25px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .popover {
            display: none;
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            padding: 20px;
            background: white;
            box-shadow: 0 5px 25px #aaa;
            border-radius: 10px;
        }

        .popover.show {
            display: block;
        }
    </style>
</head>

<body>

    <h1>Popover Component</h1>

    <div class="container">

        <button onclick="togglePopover()">
            Open Popover
        </button>

        <div id="popover" class="popover">
            <h3>Hello!</h3>
            <p>This is a popover component.</p>
        </div>

    </div>

    <script>
        function togglePopover() {
            document.getElementById("popover")
                .classList.toggle("show");
        }
    </script>

</body>
</html>
