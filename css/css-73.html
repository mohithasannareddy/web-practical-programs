<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 73 - Empty State</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 50px 20px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 35px;
        }

        .empty-box {
            max-width: 650px;
            margin: auto;
            padding: 60px 30px;
            text-align: center;
            background: white;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .empty-box h2 {
            color: #1e293b;
            margin-bottom: 12px;
        }

        .empty-box p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-3px);
        }

        nav {
            text-align: center;
            margin-top: 40px;
        }

        nav a {
            text-decoration: none;
            color: #2563eb;
            margin: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>📂 Empty State</h1>

    <div class="empty-box">

        <div class="icon">📭</div>

        <h2>No Projects Found</h2>

        <p>
            You don't have any projects yet.
            Start by creating your first project.
        </p>

        <a href="#" class="btn">
            + Create Project
        </a>

    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>

</body>
</html>
