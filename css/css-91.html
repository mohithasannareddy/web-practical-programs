
<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
        }

        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .change {
            margin-top: 8px;
            color: green;
            font-size: 14px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .panel {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            margin-top: 0;
            color: #222;
        }

        .chart {
            height: 250px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            border-bottom: 2px solid #ccc;
            padding-top: 20px;
        }

        .bar {
            width: 35px;
            background-color: #1e3a8a;
            border-radius: 5px 5px 0 0;
        }

        .bar:nth-child(1) {
            height: 40%;
        }

        .bar:nth-child(2) {
            height: 65%;
        }

        .bar:nth-child(3) {
            height: 50%;
        }

        .bar:nth-child(4) {
            height: 80%;
        }

        .bar:nth-child(5) {
            height: 60%;
        }

        .bar:nth-child(6) {
            height: 90%;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .stats:last-child {
            border-bottom: none;
        }

        .navigation {
            text-align: center;
            margin-top: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #1e3a8a;
            margin: 0 10px;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .chart {
                height: 200px;
            }
        }
    </style>
</head>

<body>

        <h1>Analytics Dashboard</h1>
    </div>

            </div>

            <div class="card">

        </div>

                    <div class="bar"></div>
