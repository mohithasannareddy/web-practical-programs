
<!DOCTYPE html>
<html>
<head>
    <title>CSS Spacing</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }

        .box {
            background-color: lightblue;
            border: 2px solid blue;
            margin: 30px;
            padding: 25px;
        }

        .small {
            margin: 10px;
            padding: 10px;
        }

        .large {
            margin: 50px;
            padding: 40px;
        }
    </style>
</head>

<body>

    <h1>CSS Margin and Padding</h1>

    <div class="box small">
        Small spacing
    </div>

    <div class="box">
        Normal spacing
    </div>

    <div class="box large">
        Large spacing
    </div>

</body>
</html>
