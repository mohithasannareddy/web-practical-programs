
<!DOCTYPE html>
<html>
<head>
    <title>Width and Height</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box1 {
            width: 300px;
            height: 100px;
            background-color: lightblue;
            margin: 20px auto;
        }

        .box2 {
            width: 70%;
            min-width: 200px;
            max-width: 500px;
            height: 150px;
            min-height: 100px;
            max-height: 200px;
            background-color: lightgreen;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <h1>CSS Width and Height</h1>

    <div class="box1">
        Width: 300px<br>
        Height: 100px
    </div>

    <div class="box2">
        Width: 70%<br>
        Min Width: 200px<br>
        Max Width: 500px
    </div>

</body>
</html>
