
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 2D Transformations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1e293b;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        .box {
            width: 180px;
            height: 150px;
            background: white;
            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: bold;

            box-shadow: 0 5px 15px #cbd5e1;

            transition: 0.5s;
        }

        /* Rotate */
        .rotate:hover {
            transform: rotate(20deg);
        }

        /* Scale */
        .scale:hover {
            transform: scale(1.25);
        }

        /* Translate */
        .translate:hover {
            transform: translate(20px, -20px);
        }

        /* Skew */
        .skew:hover {
            transform: skew(15deg, 5deg);
        }

        a {
            display: inline-block;
            margin: 50px 10px;
            padding: 12px 25px;

            background: #2563eb;
            color: white;
            text-decoration: none;

            border-radius: 25px;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <h1>CSS 2D Transformations</h1>

    <p>
        Move the mouse over each box to see different
        2D transformation effects.
    </p>

    <div class="container">

        <div class="box rotate">
            Rotate
        </div>

        <div class="box scale">
            Scale
        </div>

        <div class="box translate">
            Translate
        </div>

        <div class="box skew">
            Skew
        </div>

    </div>

    <a href="../index.html">Home</a>

    <a href="index.html">CSS Programs</a>

</body>
</html>
