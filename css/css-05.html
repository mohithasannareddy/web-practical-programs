
<!DOCTYPE html>
<html>
<head>
    <title>CSS Background Properties</title>

    <style>

        body {
            font-family: Arial;
            margin: 0;
            background-color: #f5f7fb;
        }

        h1 {
            text-align: center;
            color: darkblue;
            padding: 20px;
        }

        .box {
            width: 80%;
            height: 250px;
            margin: 30px auto;
            padding: 25px;

            /* Background color */
            background-color: lightblue;

            /* Background image */
            background-image: url("https://images.unsplash.com/photo-1500534623283-312aade485b7");

            /* Image position */
            background-position: center;

            /* Image size */
            background-size: cover;

            /* Do not repeat the image */
            background-repeat: no-repeat;

            /* Image stays fixed while scrolling */
            background-attachment: fixed;

            color: white;
            text-align: center;
            border-radius: 15px;
        }

        .content {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 30px;
            margin-top: 40px;
            border-radius: 10px;
        }

        nav {
            text-align: center;
            margin: 25px;
        }

        nav a {
            text-decoration: none;
            background-color: black;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: darkblue;
        }

    </style>
</head>

<body>

    <h1>CSS Background Properties</h1>

    <div class="box">

        <div class="content">
            <h2>Background Image</h2>

            <p>
                This example demonstrates background color,
                image, position, size, repeat and attachment.
            </p>
        </div>

    </div>

    <nav>

    </nav>

</body>
</html>
