
<!DOCTYPE html>
<html>
<head>
    <title>Button Styles</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 70px;
            background: #f8fafc;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
            border: none;
        }

        .secondary {
            background: #64748b;
            color: white;
            border: none;
        }

        .outline {
            background: white;
            color: #2563eb;
            border: 2px solid #2563eb;
        }

        .danger {
            background: #dc2626;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Button Styles</h1>

    <button class="primary">Primary</button>

    <button class="secondary">Secondary</button>

    <button class="outline">Outline</button>

    <button class="danger">Delete</button>

</body>
</html>
