
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 84 - Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .reset-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .icon {
            text-align: center;
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        nav {
            text-align: center;
            margin-top: 30px;
        }

        nav a {
            text-decoration: none;
            color: #2563eb;
            margin: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="reset-box">

        <div class="icon">🔒</div>

        <h1>Reset Password</h1>

        <p class="description">
            Create a new password for your account.
        </p>

        <form>

            <div class="form-group">
                <label for="password">New Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>

                <input
                    type="password"
                    id="confirm"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Reset Password
            </button>

        </form>

    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>

</body>
</html>
