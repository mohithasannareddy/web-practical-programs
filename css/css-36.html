<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaaS Navigation Bar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* Navigation Bar */
        nav {
            background: white;
            padding: 18px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #4f46e5;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #444;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #4f46e5;
        }

        .login {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #4f46e5;
        }

        .signup {
            padding: 10px 18px;
            border-radius: 8px;
            background: #4f46e5;
            color: white !important;
        }

        .signup:hover {
            background: #3730a3;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #4f46e5;
        }

        .hero p {
            color: #666;
            font-size: 18px;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        .hero button {
            margin-top: 30px;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .hero button:hover {
            background: #3730a3;
        }

        /* Mobile */
        @media (max-width: 700px) {
            nav {
                padding: 15px 20px;
                flex-direction: column;
                gap: 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .hero h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <!-- SaaS Navigation Bar -->
    <nav>

        <div class="logo">
            CloudFlow
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">About</a>
            <a href="#" class="login">Login</a>
            <a href="#" class="signup">Get Started</a>
        </div>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <h1>
            Build Better with <span>CloudFlow</span>
        </h1>

        <p>
            A simple SaaS platform to manage your projects,
            improve productivity, and grow your business.
        </p>

        <button>
            Start Free Trial
        </button>

    </section>

</body>
</html>
