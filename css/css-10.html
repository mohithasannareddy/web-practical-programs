
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            width: 300px;

            /* Content space */
            padding: 30px;

            /* Border */
            border: 5px solid red;

            /* Outside space */
            margin: 50px auto;

            /* Background */
            background-color: lightyellow;

            text-align: center;
        }

        .label {
            font-weight: bold;
            color: darkred;
        }

        nav {
            text-align: center;
            margin: 25px;
        }

        nav a {
            text-decoration: none;
            background-color: black;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: darkblue;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">

        <h2>Box Model</h2>

        <p>
            This is the content area.
        </p>

        <p class="label">
            Width: 300px
        </p>

        <p class="label">
            Padding: 30px
        </p>

        <p class="label">
            Border: 5px solid red
        </p>

        <p class="label">
            Margin: 50px
        </p>

    </div>

    <nav>
        <a href="../index.html">ðŸ  Home</a>
        <a href="index.html">ðŸŽ¨ CSS Programs</a>
    </nav>

</body>
</html>
