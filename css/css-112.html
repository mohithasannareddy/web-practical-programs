<!DOCTYPE html>
<html>
<head>
    <title>Analytics Filter and Sorting Panel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .panel {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .field {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .reset {
            background: #555;
        }

        .reset:hover {
            background: #333;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        .buttons a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        .buttons a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Analytics Filter & Sorting Panel</h1>

    <div class="panel">

        <div class="row">

            <div class="field">
                <label>Category</label>

                <select>
                    <option>All Categories</option>
                    <option>Technology</option>
                    <option>Education</option>
                    <option>Business</option>
                </select>
            </div>

            <div class="field">
                <label>Sort By</label>

                <select>
                    <option>Latest</option>
                    <option>Highest Value</option>
                    <option>Lowest Value</option>
                    <option>Name</option>
                </select>
            </div>

        </div>

        <div class="row">

            <div class="field">
                <label>Search</label>
                <input type="text" placeholder="Search data...">
            </div>

            <div class="field">
                <label>Status</label>

                <select>
                    <option>All</option>
                    <option>Active</option>
                    <option>Inactive</option>
                </select>
            </div>

        </div>

        <button>Apply Filters</button>
        <button class="reset">Reset</button>

    </div>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
