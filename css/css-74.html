
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 74 - Error State</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fef2f2;
            min-height: 100vh;
            padding: 50px 20px;
        }

        h1 {
            text-align: center;
            color: #991b1b;
            margin-bottom: 35px;
        }

        .error-box {
            max-width: 600px;
            margin: auto;
            padding: 50px 30px;
            text-align: center;
            background: white;
            border: 2px solid #fecaca;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .error-box h2 {
            color: #b91c1c;
            margin-bottom: 12px;
        }

        .error-box p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #dc2626;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #b91c1c;
            transform: translateY(-3px);
        }

        nav {
            text-align: center;
            margin-top: 40px;
        }

        nav a {
            text-decoration: none;
            color: #dc2626;
            margin: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>⚠️ Error State</h1>

    <div class="error-box">
        <div class="icon">❌</div>

        <h2>Something Went Wrong</h2>

        <p>
            We couldn't complete your request.
            Please try again or check your internet connection.
        </p>

        <a href="#" class="btn">Try Again</a>
    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>

</body>
</html>
