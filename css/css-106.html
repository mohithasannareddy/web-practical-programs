<!DOCTYPE html>
<html>
<head>
    <title>Bar Chart Analytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .chart {
            width: 80%;
            max-width: 800px;
            height: 350px;
            background: white;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            display: flex;
            align-items: flex-end;
            justify-content: space-around;
        }

        .item {
            text-align: center;
        }

        .bar {
            width: 60px;
            background: #2563eb;
            color: white;
            border-radius: 8px 8px 0 0;
            padding-top: 10px;
        }

        .bar1 {
            height: 100px;
        }

        .bar2 {
            height: 160px;
        }

        .bar3 {
            height: 220px;
        }

        .bar4 {
            height: 140px;
        }

        .bar5 {
            height: 250px;
        }

        .label {
            margin-top: 10px;
            font-weight: bold;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Bar Chart Analytics</h1>

    <div class="chart">

        <div class="item">
            <div class="bar bar1">20</div>
            <div class="label">Jan</div>
        </div>

        <div class="item">
            <div class="bar bar2">35</div>
            <div class="label">Feb</div>
        </div>

        <div class="item">
            <div class="bar bar3">50</div>
            <div class="label">Mar</div>
        </div>

        <div class="item">
            <div class="bar bar4">30</div>
            <div class="label">Apr</div>
        </div>

        <div class="item">
            <div class="bar bar5">60</div>
            <div class="label">May</div>
        </div>

    </div>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
