
<!DOCTYPE html>
<html>
<head>
    <title>Marketing Analytics</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
        }

        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .growth {
            margin-top: 8px;
            color: green;
            font-size: 14px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .panel {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            margin-top: 0;
            color: #222;
        }

        .campaign {
            margin-bottom: 20px;
        }

        .campaign-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .progress {
            height: 12px;
            background-color: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #1e3a8a;
            border-radius: 10px;
        }

        .social {
            width: 85%;
        }

        .email {
            width: 70%;
        }

        .search {
            width: 60%;
        }

        .display {
            width: 45%;
        }

        .channel {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .channel:last-child {
            border-bottom: none;
        }

        .channel strong {
            color: #1e3a8a;
        }

        .navigation {
            text-align: center;
            margin-top: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #1e3a8a;
            margin: 0 10px;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Marketing Analytics</h1>
    </div>

    <div class="container">

        <div class="cards">

            <div class="card">
                <h3>Total Campaigns</h3>
                <div class="value">48</div>
                <div class="growth">↑ 12.5%</div>
            </div>

            <div class="card">
                <h3>Total Reach</h3>
                <div class="value">2.8M</div>
                <div class="growth">↑ 18.2
