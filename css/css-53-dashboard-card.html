
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 40px;
        }

        .dashboard {
            max-width: 700px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
        }

        @media(max-width:600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="card">
            <h3>👥 Users</h3>
            <div class="value">2,540</div>
        </div>

        <div class="card">
            <h3>💰 Revenue</h3>
            <div class="value">₹85K</div>
        </div>

        <div class="card">
            <h3>📦 Orders</h3>
            <div class="value">1,250</div>
        </div>

        <div class="card">
            <h3>📈 Growth</h3>
            <div class="value">18%</div>
        </div>

    </div>

</body>
</html>
