<!DOCTYPE html>
<html>
<head>
    <title>Customizable Dashboard Widgets</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .dashboard {
            max-width: 900px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .widget {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .widget h2 {
            color: #555;
            font-size: 20px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0;
        }

        .widget button {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .widget button:hover {
            background: #444;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        .buttons a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        .buttons a:hover {
            background: #444;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Customizable Dashboard Widgets</h1>

    <div class="dashboard">

        <div class="widget">
            <h2>Total Users</h2>
            <div class="number">5,240</div>
            <button>Customize</button>
        </div>

        <div class="widget">
            <h2>Revenue</h2>
            <div class="number">₹75K</div>
            <button>Customize</button>
        </div>

        <div class="widget">
            <h2>Orders</h2>
            <div class="number">1,250</div>
            <button>Customize</button>
        </div>

    </div>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
