<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        .product-card {
            width: min(100%, 360px);
            overflow: hidden;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.12);
        }

        .product-image {
            min-height: 230px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            font-size: 96px;
        }

        .product-content {
            padding: 24px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .description {
            margin: 0 0 20px;
            color: #64748b;
            line-height: 1.6;
        }

        .purchase-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <article class="product-card">
        <div class="product-image" aria-label="Blue wireless headphones">&#127911;</div>

        <div class="product-content">
            <p class="eyebrow">Featured product</p>
            <h1>CloudSound Headphones</h1>
            <p class="description">Wireless noise-cancelling headphones with all-day comfort and clear audio.</p>

            <div class="purchase-row">
                <span class="price">$129</span>
                <button type="button">Add to cart</button>
            </div>
        </div>
    </article>
</body>
</html>
