
<!DOCTYPE html>
<html>
<head>
    <title>CSS Outline</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        .box {
            width: 250px;
            padding: 40px;
            margin: auto;

            background-color: lightyellow;
            border: 3px solid blue;

            outline: 5px dashed red;
            outline-offset: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Outline</h1>

    <div class="box">
        This box demonstrates
        outline and outline-offset.
    </div>

</body>
</html>
