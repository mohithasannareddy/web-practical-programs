
<!DOCTYPE html>
<html>
<head>
    <title>CSS Units</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .percentage {
            width: 80%;
            height: 100px;
            background-color: lightblue;
        }

        .viewport {
            width: 50vw;
            height: 20vh;
            background-color: lightgreen;
        }

        .rem-box {
            width: 20rem;
            height: 8rem;
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <h1>CSS Width, Height and Units</h1>

    <h2>Percentage</h2>
    <div class="percentage">
        Width: 80%
    </div>

    <h2>Viewport Units</h2>
    <div class="viewport">
        Width: 50vw<br>
        Height: 20vh
    </div>

    <h2>REM Units</h2>
    <div class="rem-box">
        Width: 20rem<br>
        Height: 8rem
    </div>

</body>
</html>
