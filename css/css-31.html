

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Transitions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1e293b;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .box {
            width: 180px;
            height: 150px;
            background: white;
            border-radius: 15px;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;

            transition: all 0.5s ease;
        }

        /* Color transition */
        .color:hover {
            background: #2563eb;
            color: white;
        }

        /* Size transition */
        .size:hover {
            transform: scale(1.2);
        }

        /* Shadow transition */
        .shadow:hover {
            box-shadow: 0 15px 35px #64748b;
        }

        /* Position transition */
        .position:hover {
            transform: translateY(-25px);
        }

        a {
            display: inline-block;
            margin: 40px 10px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        a:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>CSS Transitions</h1>

    <p>
        Move your mouse over each box to see different
        CSS transition effects.
    </p>

    <div class="container">

        <div class="box color">
            Color Transition
        </div>

        <div class="box size">
            Size Transition
        </div>

        <div class="box shadow">
            Shadow Transition
        </div>

        <div class="box position">
            Position Transition
        </div>

    </div>

    <a href="../index.html">Home</a>

    <a href="index.html">CSS Programs</a>

</body>
</html>
