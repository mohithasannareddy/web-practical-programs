
<!DOCTYPE html>
<html>
<head>
    <title>Activity Feed</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 40px;
        }

        .feed {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        .activity {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .activity:last-child {
            border-bottom: none;
        }

        .time {
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="feed">

        <h2>Activity Feed</h2>

        <div class="activity">
            <b>👩 Mohitha</b> created a new project.
            <div class="time">10 minutes ago</div>
        </div>

        <div class="activity">
            <b>👨 Rahul</b> completed a task.
            <div class="time">30 minutes ago</div>
        </div>

        <div class="activity">
            <b>👩 Priya</b> uploaded a file.
            <div class="time">1 hour ago</div>
        </div>

    </div>

</body>
</html>
