
<!DOCTYPE html>
<html>
<head>
    <title>Landing Page Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            box-shadow: 0 2px 10px #ddd;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
        }

        nav a {
            margin: 0 12px;
            text-decoration: none;
            color: #333;
        }

        .btn {
            background: #4f46e5;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
        }

        @media(max-width:600px) {
            nav {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">CloudApp</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">Contact</a>
        </nav>

        <a href="#" class="btn">Get Started</a>

    </header>

</body>
</html>
