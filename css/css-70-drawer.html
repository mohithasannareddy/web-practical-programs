
<!DOCTYPE html>
<html>
<head>
    <title>Drawer Panel</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 70px;
            text-align: center;
        }

        button {
            padding: 12px 25px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -350px;
            width: 300px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 20px #aaa;
            padding: 25px;

            transition: 0.4s;
        }

        .drawer.open {
            right: 0;
        }

        .close {
            background: #dc2626;
        }

        .drawer a {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <h1>Drawer Component</h1>

    <button onclick="openDrawer()">
        Open Drawer
    </button>

    <div id="drawer" class="drawer">

        <button class="close" onclick="closeDrawer()">
            Close
        </button>

        <h2>Menu</h2>

        <a href="#">🏠 Home</a>

        <a href="#">📊 Dashboard</a>

        <a href="#">👤 Profile</a>

        <a href="#">⚙️ Settings</a>

    </div>

    <script>
        function openDrawer() {
            document.getElementById("drawer")
                .classList.add("open");
        }

        function closeDrawer() {
            document.getElementById("drawer")
                .classList.remove("open");
        }
    </script>

</body>
</html>
