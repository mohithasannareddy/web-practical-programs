
<!DOCTYPE html>
<html>
<head>
    <title>Product Analytics</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
        }

        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .growth {
            color: green;
            margin-top: 8px;
            font-size: 14px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .panel {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            margin-top: 0;
            color: #222;
        }

        .chart {
            height: 250px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            border-bottom: 2px solid #ccc;
        }

        .bar {
            width: 45px;
            background-color: #1e3a8a;
            border-radius: 5px 5px 0 0;
        }

        .bar1 {
            height: 100px;
        }

        .bar2 {
            height: 150px;
        }

        .bar3 {
            height: 125px;
        }

        .bar4 {
            height: 180px;
        }

        .bar5 {
            height: 160px;
        }

        .bar6 {
            height: 220px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .product:last-child {
            border-bottom: none;
        }

        .product strong {
            color: #1e3a8a;
        }

        .navigation {
            text-align: center;
            margin-top: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #1e3a8a;
            margin: 0 10px;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .bar {
                width: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Product Analytics</h1>
    </div>

    <div class="container">

        <div class="cards">

            <div class="card">
                <h3>Total Products</h3>
                <div class="value">1,250</div>
                <div class="growth">↑ 8.4%</div>
            </div>

            <div class="card">
                <h3>Active Products</h3>
                <div class="value">980</div>
                <div class="growth">↑ 12.1%</div>
