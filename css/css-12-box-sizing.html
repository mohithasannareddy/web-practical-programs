
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Sizing</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 300px;
            padding: 30px;
            border: 5px solid blue;
            margin: 30px auto;
        }

        .content-box {
            box-sizing: content-box;
            background-color: lightyellow;
        }

        .border-box {
            box-sizing: border-box;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>CSS Box Sizing</h1>

    <div class="box content-box">
        <h2>Content Box</h2>
        box-sizing: content-box
    </div>

    <div class="box border-box">
        <h2>Border Box</h2>
        box-sizing: border-box
    </div>

</body>
</html>
