
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 70 - Drawer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e293b;
        }

        .open-btn {
            display: block;
            margin: auto;
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .open-btn:hover {
            background: #1d4ed8;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background: white;
            padding: 30px;
            box-shadow: 5px 0 20px rgba(0,0,0,0.2);
            transition: 0.4s;
        }

        .drawer:target {
            left: 0;
        }

        .drawer h2 {
            margin-bottom: 25px;
            color: #1e293b;
        }

        .drawer a {
            display: block;
            text-decoration: none;
            color: #334155;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .close-btn {
            display: block;
            margin-top: 30px;
            padding: 10px;
            text-align: center;
            background: #ef4444;
            color: white !important;
            border-radius: 6px;
        }

        nav {
            margin-top: 50px;
            text-align: center;
        }

        nav a {
            color: #2563eb;
            text-decoration: none;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Drawer and Slide-Out Panel</h1>

    <a href="#drawer" class="open-btn">Open Drawer</a>

    <div id="drawer" class="drawer">

        <h2>☰ Menu</h2>

        <a href="#">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Notifications</a>
        <a href="#">Help</a>

        <a href="#" class="close-btn">Close Drawer</a>

    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>

</body>
</html>
