<!DOCTYPE html>
<html>
<head>
    <title>CSS 117 - AI Chat Interface</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 22px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 35px auto;
        }

        .chat-box {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .chat-header {
            background: #2563eb;
            color: white;
            padding: 18px 25px;
        }

        .chat-header h2 {
            margin: 0;
        }

        .chat-header p {
            margin: 5px 0 0;
        }

        .messages {
            padding: 25px;
            min-height: 400px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
        }

        .message .icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            background: #dbeafe;
        }

        .text {
            max-width: 65%;
            padding: 13px 17px;
            border-radius: 14px;
            background: #f3f4f6;
            line-height: 1.5;
        }

        .user {
            justify-content: flex-end;
        }

        .user .text {
            background: #2563eb;
            color: white;
            margin-right: 12px;
        }

        .user .icon {
            order: 2;
            margin-right: 0;
            background: #e0e7ff;
        }

        .input-box {
            border-top: 1px solid #ddd;
            padding: 18px;
            display: flex;
            gap: 10px;
        }

        .input-box input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .input-box button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .input-box button:hover {
            background: #1d4ed8;
        }

        .navigation {
            text-align: center;
            margin-top: 25px;
        }

        .navigation a {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .navigation a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>AI Chat Interface</h1>
        <p>CSS Practical Program 117</p>
    </div>

    <div class="container">

        <div class="chat-box">

            <div class="chat-header">
                <h2>💬 AI Chat</h2>
                <p>Your smart conversation assistant</p>
            </div>

            <div class="messages">

                <div class="message">
                    <div class="icon">🤖</div>
                    <div class="text">
                        Hello! Welcome to AI Chat. How can I help you?
                    </div>
                </div>

                <div class="message user">
                    <div class="text">
                        What is CSS?
                    </div>
                    <div class="icon">👤</div>
                </div>

                <div class="message">
                    <div class="icon">🤖</div>
                    <div class="text">
                        CSS stands for Cascading Style Sheets.
                        It is used to style and design web pages.
                    </div>
                </div>

            </div>

            <div class="input-box">
                <input type="text" placeholder="Type your message...">
                <button>Send ➤</button>
            </div>

        </div>

        <div class="navigation">
            <a href="../index.html">🏠 Home</a>
            <a href="index.html">⬅ CSS Programs</a>
        </div>

    </div>

</body>
</html>
