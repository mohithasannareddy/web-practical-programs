<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive SaaS Navigation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        /* Navigation */
        nav {
            background: white;
            padding: 18px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            padding: 10px;
        }

        .nav-links a:hover {
            color: #4f46e5;
        }

        .button {
            background: #4f46e5;
            color: white !important;
            border-radius: 8px;
            padding: 10px 18px !important;
        }

        .button:hover {
            background: #3730a3;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 45px;
            color: #222;
        }

        .hero h1 span {
            color: #4f46e5;
        }

        .hero p {
            max-width: 600px;
            margin: auto;
            color: #666;
            line-height: 1.6;
            font-size: 18px;
        }

        /* Mobile Menu */
        .menu-icon {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 700px) {

            nav {
                padding: 18px 25px;
                position: relative;
            }

            .menu-icon {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: white;
                flex-direction: column;
                padding: 20px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            }

            .nav-links a {
                width: 100%;
                text-align: center;
            }

            /* Show menu when hovering over navigation */
            nav:hover .nav-links {
                display: flex;
            }

            .hero {
                padding: 70px 20px;
            }

            .hero h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">
            CloudFlow
        </div>

        <div class="menu-icon">
            â˜°
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#" class="button">Get Started</a>
            <a href="../index.html">Home</a>
        </div>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <h1>
            Simple SaaS for <span>Modern Teams</span>
        </h1>

        <p>
            Manage your projects, collaborate with your team,
            and improve productivity using CloudFlow.
        </p>

    </section>

</body>
</html>
