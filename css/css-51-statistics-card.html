
<!DOCTYPE html>
<html>
<head>
    <title>Statistics Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 50px;
        }

        .card {
            width: 300px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px #ccc;
        }

        .number {
            font-size: 40px;
            font-weight: bold;
            color: #2563eb;
        }

        .change {
            color: green;
        }
    </style>
</head>

<body>

    <div class="card">

        <h3>Total Users</h3>

        <div class="number">12,540</div>

        <p class="change">↑ 12.5% this month</p>

    </div>

</body>
</html>
