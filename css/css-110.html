<!DOCTYPE html>
<html>
<head>
    <title>Data Visualization Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 35px;
        }

        .card {
            width: 220px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 18px;
            color: #555;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0;
        }

        .bar {
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #2563eb;
        }

        .progress1 {
            width: 80%;
        }

        .progress2 {
            width: 60%;
        }

        .progress3 {
            width: 90%;
        }

        .info {
            color: #666;
            font-size: 14px;
        }

        .buttons {
            text-align: center;
            margin-top: 35px;
        }

        a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Data Visualization Cards</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Total Users</h2>
            <div class="value">12,450</div>

            <div class="bar">
                <div class="progress progress1"></div>
            </div>

            <p class="info">80% of target reached</p>
        </div>

        <div class="card">
            <h2>Revenue</h2>
            <div class="value">₹85K</div>

            <div class="bar">
                <div class="progress progress2"></div>
            </div>

            <p class="info">60% of monthly target</p>
        </div>

        <div class="card">
            <h2>Performance</h2>
            <div class="value">90%</div>

            <div class="bar">
                <div class="progress progress3"></div>
            </div>

            <p class="info">Excellent performance</p>
        </div>

    </div>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
