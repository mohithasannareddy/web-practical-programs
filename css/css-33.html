
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 3D Transformations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1e293b;
        }

        p {
            color: #475569;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        /* Common card style */
        .card {
            width: 200px;
            height: 160px;

            background: white;
            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;

            box-shadow: 0 5px 15px #cbd5e1;

            transition: 0.8s;
        }

        /* 3D Rotation */
        .rotate-x:hover {
            transform: perspective(500px) rotateX(50deg);
        }

        .rotate-y:hover {
            transform: perspective(500px) rotateY(50deg);
        }

        /* 3D Translation */
        .translate-z:hover {
            transform: perspective(500px) translateZ(80px);
        }

        /* 3D Scale */
        .scale-3d:hover {
            transform: perspective(500px) scale3d(1.2, 1.2, 1.2);
        }

        a {
            display: inline-block;
            margin: 50px 10px;
            padding: 12px 25px;

            background: #2563eb;
            color: white;

            text-decoration: none;
            border-radius: 25px;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <h1>CSS 3D Transformations</h1>

    <p>
        Move your mouse over the cards to see
        different 3D transformation effects.
    </p>

    <div class="container">

        <div class="card rotate-x">
            Rotate X
        </div>

        <div class="card rotate-y">
            Rotate Y
        </div>

        <div class="card translate-z">
            Translate Z
        </div>

        <div class="card scale-3d">
            Scale 3D
        </div>

    </div>

    <a href="../index.html">Home</a>

    <a href="index.html">CSS Programs</a>

</body>
</html>
