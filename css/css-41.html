<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mega Navigation Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* Navigation Bar */
        nav {
            background: white;
            padding: 18px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-links a,
        .mega-btn {
            text-decoration: none;
            color: #333;
            padding: 12px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 15px;
            border-radius: 8px;
        }

        .nav-links a:hover,
        .mega:hover .mega-btn {
            background: #4f46e5;
            color: white;
        }

        /* Mega Menu */
        .mega {
            position: relative;
        }

        .mega-content {
            display: none;
            position: absolute;
            top: 48px;
            right: -150px;
            width: 650px;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .mega:hover .mega-content {
            display: flex;
            gap: 35px;
        }

        .column {
            flex: 1;
        }

        .column h3 {
            margin-top: 0;
            color: #4f46e5;
        }

        .column a {
            display: block;
            padding: 9px 0;
            color: #555;
            text-decoration: none;
        }

        .column a:hover {
            color: #4f46e5;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 45px;
        }

        .hero h1 span {
            color: #4f46e5;
        }

        .hero p {
            max-width: 600px;
            margin: auto;
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Mobile */
        @media (max-width: 750px) {

            nav {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .mega-content {
                width: 90vw;
                right: -100px;
            }

            .mega:hover .mega-content {
                flex-direction: column;
                gap: 10px;
            }

            .hero h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">
            CloudFlow
        </div>

        <div class="nav-links">

            <a href="#">Home</a>

            <!-- Mega Menu -->
            <div class="mega">

                <button class="mega-btn">
                    Products â–¾
                </button>

                <div class="mega-content">

                    <div class="column">
                        <h3>Management</h3>

                        <a href="#">Project Management</a>
                        <a href="#">Task Management</a>
                        <a href="#">Team Management</a>
                    </div>

                    <div class="column">
                        <h3>Analytics</h3>

                        <a href="#">Reports</a>
                        <a href="#">Dashboard</a>
                        <a href="#">Data Analytics</a>
                    </div>

                    <div class="column">
                        <h3>Tools</h3>

                        <a href="#">Automation</a>
                        <a href="#">Integrations</a>
                        <a href="#">API</a>
                    </div>

                </div>

            </div>

            <a href="#">Pricing</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="../index.html">Home</a>

        </div>

    </nav>

    <!-- Main Content -->
    <section class="hero">

        <h1>
            Explore <span>CloudFlow</span>
        </h1>

        <p>
            Hover over the Products menu to view
            multiple categories in the mega navigation menu.
        </p>

    </section>

</body>
</html>
