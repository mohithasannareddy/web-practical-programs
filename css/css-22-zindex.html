
<!DOCTYPE html>
<html>
<head>
    <title>CSS Z-Index</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .container {
            position: relative;
            height: 300px;
            margin: 50px;
        }

        .box {
            position: absolute;
            width: 180px;
            height: 180px;
            padding: 20px;
        }

        .box1 {
            background-color: red;
            left: 100px;
            top: 50px;
            z-index: 1;
        }

        .box2 {
            background-color: blue;
            left: 180px;
            top: 100px;
            z-index: 2;
        }

        .box3 {
            background-color: green;
            left: 260px;
            top: 150px;
            z-index: 3;
        }
    </style>
</head>

<body>

    <h1>CSS z-index</h1>

    <p>The box with the highest z-index appears on top.</p>

    <div class="container">
        <div class="box box1">z-index: 1</div>
        <div class="box box2">z-index: 2</div>
        <div class="box box3">z-index: 3</div>
    </div>

</body>
</html>
