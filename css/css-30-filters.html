
<!DOCTYPE html>
<html>
<head>
    <title>CSS Filters</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .gallery img {
            width: 180px;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
        }

        .blur {
            filter: blur(4px);
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .brightness {
            filter: brightness(150%);
        }

        .contrast {
            filter: contrast(180%);
        }

        .opacity {
            filter: opacity(40%);
        }
    </style>
</head>

<body>

    <h1>CSS Filters</h1>

    <div class="gallery">

        <div>
            <img src="https://picsum.photos/300/200?1" alt="Blur"
                 class="blur">
            <p>Blur</p>
        </div>

        <div>
            <img src="https://picsum.photos/300/200?2" alt="Grayscale"
                 class="grayscale">
            <p>Grayscale</p>
        </div>

        <div>
            <img src="https://picsum.photos/300/200?3" alt="Brightness"
                 class="brightness">
            <p>Brightness</p>
        </div>

        <div>
            <img src="https://picsum.photos/300/200?4" alt="Contrast"
                 class="contrast">
            <p>Contrast</p>
        </div>

        <div>
            <img src="https://picsum.photos/300/200?5" alt="Opacity"
                 class="opacity">
            <p>Opacity</p>
        </div>

    </div>

</body>
</html>
