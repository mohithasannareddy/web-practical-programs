
<!DOCTYPE html>
<html>
<head>
    <title>CSS Overflow</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 300px;
            height: 100px;
            border: 3px solid blue;
            margin: 30px auto;
            padding: 10px;
            overflow: auto;
            text-align: left;
        }
    </style>
</head>

<body>

    <h1>CSS Overflow</h1>

    <div class="box">
        This is a large amount of text inside a small box.
        The overflow property controls what happens when
        the content is larger than the box.
        Scrollbars will appear when required.
        This demonstrates overflow: auto.
    </div>

</body>
</html>
