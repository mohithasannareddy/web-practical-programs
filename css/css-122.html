<!DOCTYPE html>
<html>
<head>
    <title>CSS 122 - AI Prompt Input Interface</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 22px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 45px auto;
        }

        .prompt-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .prompt-card h2 {
            text-align: center;
            color: #1e293b;
            margin-top: 0;
        }

        .prompt-card p {
            text-align: center;
            color: #64748b;
        }

        .prompt-box {
            margin-top: 25px;
            border: 2px solid #6366f1;
            border-radius: 15px;
            padding: 15px;
            background: #f8fafc;
        }

        .prompt-box textarea {
            width: 100%;
            height: 150px;
            resize: vertical;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .prompt-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .hint {
            color: #64748b;
            font-size: 13px;
        }

        .generate {
            padding: 13px 24px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .generate:hover {
            background: #3730a3;
        }

        .suggestions {
            margin-top: 25px;
        }

        .suggestions h3 {
            color: #334155;
        }

        .suggestion {
            display: inline-block;
            padding: 10px 14px;
            margin: 5px;
            background: #e0e7ff;
            color: #4338ca;
            border-radius: 20px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #c7d2fe;
        }

        .navigation {
            text-align: center;
            margin-top: 25px;
        }

        .navigation a {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .navigation a:hover {
            background: #3730a3;
        }

        @media (max-width: 600px) {
            .prompt-footer {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }

            .generate {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>AI Prompt Input Interface</h1>
        <p>CSS Practical Program 122</p>
    </div>

    <div class="container">

        <div class="prompt-card">

            <h2>✨ Create with AI</h2>

            <p>
                Enter your prompt and describe what you want the AI
                assistant to create.
            </p>

            <div class="prompt-box">

                <textarea placeholder="Write your prompt here...">Create a simple portfolio website using HTML and CSS.</textarea>

                <div class="prompt-footer">
                    <span class="hint">💡 Be clear and specific</span>

                    <button class="generate">
                        Generate ✨
                    </button>
                </div>

            </div>

            <div class="suggestions">

                <h3>Prompt Suggestions</h3>

                <span class="suggestion">
                    Create a website
                </span>

                <span class="suggestion">
                    Explain a topic
                </span>

                <span class="suggestion">
                    Write code
                </span>

                <span class="suggestion">
                    Summarize text
                </span>

            </div>

        </div>

        <div class="navigation">
            <a href="../index.html">🏠 Home</a>
            <a href="index.html">⬅ CSS Programs</a>
        </div>

    </div>

</body>
</html>
