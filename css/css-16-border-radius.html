
<!DOCTYPE html>
<html>
<head>
    <title>CSS Border Radius</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        .card {
            width: 250px;
            padding: 30px;
            margin: 20px auto;
            background-color: lightblue;
            border-radius: 20px;
        }

        .circle {
            width: 120px;
            height: 120px;
            background-color: orange;
            border-radius: 50%;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pill {
            display: inline-block;
            padding: 12px 30px;
            background-color: green;
            color: white;
            border-radius: 50px;
        }
    </style>
</head>

<body>

    <h1>CSS Border Radius</h1>

    <div class="card">
        Rounded Card
    </div>

    <div class="circle">
        Circle
    </div>

    <div class="pill">
        Pill Button
    </div>

</body>
</html>
