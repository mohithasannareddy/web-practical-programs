
<!DOCTYPE html>
<html>
<head>
    <title>CSS Shadows</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #eeeeee;
        }

        h1 {
            color: darkblue;
            text-shadow: 3px 3px 5px gray;
        }

        .card {
            width: 300px;
            padding: 40px;
            margin: 50px auto;
            background-color: white;
            border-radius: 15px;

            box-shadow: 5px 5px 20px gray;
        }
    </style>
</head>

<body>

    <h1>CSS Shadows</h1>

    <div class="card">
        <h2>Shadow Card</h2>
        <p>This card uses box-shadow.</p>
    </div>

</body>
</html>
