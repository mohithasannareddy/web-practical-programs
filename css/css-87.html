
<!DOCTYPE html>
<html>
<head>
    <title>Multi-Step Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .steps {
            display: flex;
            justify-content: space-between;
            margin: 25px 0;
        }

        .step {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .step.active {
            background-color: #1e3a8a;
            color: white;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #1e3a8a;
            outline: none;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #1e3a8a;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #162d6b;
        }

        .navigation {
            text-align: center;
            margin-top: 25px;
        }

        .navigation a {
            text-decoration: none;
            color: #1e3a8a;
            margin: 0 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <div class="steps">
            <div class="step active">1</div>
            <div class="step">2</div>
            <div class="step">3</div>
        </div>

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="course">Course</label>
            <select id="course">
                <option>Select Course</option>
                <option>CSE</option>
                <option>AIML</option>
                <option>Data Science</option>
            </select>

            <div class="buttons">
                <button type="button">Previous</button>
                <button type="submit">Next</button>
            </div>

        </form>

        <div class="navigation">
            <a href="../index.html">Home</a>
            <a href="index.html">Back to Programs</a>
        </div>

    </div>

</body>
</html>
