        body {

            margin: auto;
            padding: 30px;

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #6366f1;
            color: white;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        h2 {
            margin-bottom: 5px;
        }

        p {
            color: #666;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #6366f1;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
