<!DOCTYPE html>
<html>
<head>
    <title>Analytics Report and Export Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .report {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .report h2 {
            margin-top: 0;
            color: #444;
        }

        .data {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .data:last-child {
            border-bottom: none;
        }

        .value {
            font-weight: bold;
            color: #2563eb;
        }

        .export {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 22px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .pdf {
            background: #555;
        }

        .pdf:hover {
            background: #333;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        .buttons a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        .buttons a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Analytics Report</h1>

    <div class="container">

        <div class="report">

            <h2>Monthly Performance Report</h2>

            <div class="data">
                <span>Total Users</span>
                <span class="value">12,450</span>
            </div>

            <div class="data">
                <span>Total Revenue</span>
                <span class="value">₹85,000</span>
            </div>

            <div class="data">
                <span>Total Orders</span>
                <span class="value">2,350</span>
            </div>

            <div class="data">
                <span>Conversion Rate</span>
                <span class="value">8.5%</span>
            </div>

        </div>

        <div class="export">
            <button>Export CSV</button>
            <button class="pdf">Export PDF</button>
        </div>

    </div>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
