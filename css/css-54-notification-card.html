
<!DOCTYPE html>
<html>
<head>
    <title>Notification Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 50px;
        }

        .notification {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            background: white;
            border-left: 5px solid #2563eb;
            border-radius: 10px;
            box-shadow: 0 5px 20px #ccc;
        }

        .notification h3 {
            margin-top: 0;
        }

        .notification p {
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="notification">

        <h3>🔔 New Notification</h3>

        <p>
            Your practical assignment has been submitted successfully.
        </p>

        <small>Just now</small>

    </div>

</body>
</html>
