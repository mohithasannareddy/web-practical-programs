<!DOCTYPE html>
<html>
<head>
    <title>CSS 124 - AI Response Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 22px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .response-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .top {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 20px;
        }

        .ai-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .top h2 {
            margin: 0;
            color: #1e293b;
        }

        .top p {
            margin: 5px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        .question {
            margin-top: 25px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
            color: #475569;
        }

        .answer {
            margin-top: 25px;
        }

        .answer h3 {
            color: #4338ca;
            margin-bottom: 10px;
        }

        .answer p {
            color: #334155;
            line-height: 1.7;
        }

        .code {
            background: #1e293b;
            color: white;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: monospace;
            overflow-x: auto;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .actions button {
            padding: 10px 16px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .actions button:hover {
            background: #eef2ff;
        }

        .navigation {
            text-align: center;
            margin-top: 25px;
        }

        .navigation a {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .navigation a:hover {
            background: #3730a3;
        }

        @media (max-width: 600px) {
            .actions {
                flex-direction: column;
            }

            .actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>AI Response Card</h1>
        <p>CSS Practical Program 124</p>
    </div>

    <div class="container">

        <div class="response-card">

            <div class="top">
                <div class="ai-icon">🤖</div>

                <div>
                    <h2>AI Assistant</h2>
                    <p>Generated response</p>
                </div>
            </div>

            <div class="question">
                <strong>Question:</strong>
                What is HTML?
            </div>

            <div class="answer">

                <h3>✨ AI Response</h3>

                <p>
                    HTML stands for HyperText Markup Language.
                    It is used to create the structure and content
                    of web pages.
                </p>

                <div class="code">
                    &lt;h1&gt;Hello World&lt;/h1&gt;
                </div>

            </div>

            <div class="actions">
                <button>👍 Helpful</button>
                <button>📋 Copy</button>
                <button>🔄 Regenerate</button>
            </div>

        </div>

        <div class="navigation">
            <a href="../index.html">🏠 Home</a>
            <a href="index.html">⬅ CSS Programs</a>
        </div>

    </div>

</body>
</html>
