
<!DOCTYPE html>
<html>
<head>
    <title>CSS Object Fit</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 250px;
            height: 180px;
            border: 3px solid #333;
        }

        img {
            width: 100%;
            height: 100%;
        }

        .cover {
            object-fit: cover;
        }

        .contain {
            object-fit: contain;
        }

        .position {
            object-fit: cover;
            object-position: right;
        }
    </style>
</head>

<body>

    <h1>CSS Object Fit and Object Position</h1>

    <div class="gallery">

        <div class="box">
            <img
                class="cover"
                src="https://picsum.photos/500/300"
                alt="Sample">
        </div>

        <div class="box">
            <img
                class="contain"
                src="https://picsum.photos/500/300"
                alt="Sample">
        </div>

        <div class="box">
            <img
                class="position"
                src="https://picsum.photos/500/300"
                alt="Sample">
        </div>

    </div>

    <p>
        First: object-fit: cover
    </p>

    <p>
        Second: object-fit: contain
    </p>

    <p>
        Third: object-position: right
    </p>

</body>
</html>
