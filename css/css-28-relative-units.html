
<!DOCTYPE html>
<html>
<head>
    <title>CSS Relative Units</title>

    <style>
        html {
            font-size: 16px;
        }

        body {
            font-family: Arial;
            margin: 0;
        }

        .percentage {
            width: 80%;
            background-color: lightblue;
            padding: 20px;
        }

        .em {
            font-size: 2em;
            background-color: lightgreen;
            padding: 1em;
        }

        .rem {
            font-size: 2rem;
            background-color: lightpink;
            padding: 1rem;
        }

        .viewport {
            width: 50vw;
            height: 20vh;
            background-color: lightyellow;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Relative Units</h1>

    <div class="percentage">
        Percentage Unit: 80%
    </div>

    <div class="em">
        EM Unit
    </div>

    <div class="rem">
        REM Unit
    </div>

    <div class="viewport">
        VW and VH Units
    </div>

</body>
</html>
