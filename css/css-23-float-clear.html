
<!DOCTYPE html>
<html>
<head>
    <title>CSS Float and Clear</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        img {
            width: 150px;
            height: 150px;
            float: left;
            margin-right: 20px;
        }

        .clear {
            clear: both;
            background-color: lightblue;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>Float and Clear</h1>

    <img src="https://via.placeholder.com/150" alt="Sample">

    <p>
        The image is floated to the left.
        The text automatically moves around the image.
        This demonstrates the CSS float property.
    </p>

    <div class="clear">
        This section uses clear: both.
    </div>

</body>
</html>
