<!DOCTYPE html>
<html>
<head>
    <title>Customizable Analytics Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .dashboard {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .widget {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .widget h2 {
            margin-top: 0;
            color: #555;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0;
        }

        .bar {
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #2563eb;
            width: 75%;
        }

        .chart {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            height: 150px;
        }

        .chart div {
            width: 35px;
            background: #60a5fa;
            border-radius: 6px 6px 0 0;
        }

        .b1 {
            height: 60px;
        }

        .b2 {
            height: 100px;
        }

        .b3 {
            height: 80px;
        }

        .b4 {
            height: 130px;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        .buttons a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        .buttons a:hover {
            background: #444;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Customizable Analytics Dashboard</h1>

    <div class="dashboard">

        <div class="widget">
            <h2>Total Users</h2>
            <div class="value">12,450</div>

            <div class="bar">
                <div class="progress"></div>
            </div>

            <p>75% of monthly target</p>
        </div>

        <div class="widget">
            <h2>Revenue</h2>
            <div class="value">₹85,000</div>
            <p>Monthly revenue</p>
        </div>

        <div class="widget">
            <h2>Monthly Activity</h2>

            <div class="chart">
                <div class="b1"></div>
                <div class="b2"></div>
                <div class="b3"></div>
                <div class="b4"></div>
            </div>
        </div>

        <div class="widget">
            <h2>Performance</h2>
            <div class="value">92%</div>
            <p>Overall dashboard performance</p>
        </div>

    </div>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
