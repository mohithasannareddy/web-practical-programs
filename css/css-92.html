
<!DOCTYPE html>
<html>
<head>
    <title>KPI Analytics Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
        }

        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .kpi {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .kpi h3 {
            margin-top: 0;
            color: #555;
            font-size: 16px;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .growth {
            margin-top: 8px;
            color: green;
            font-size: 14px;
        }

        .section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .panel {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            margin-top: 0;
            color: #222;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric strong {
            color: #1e3a8a;
        }

        .chart {
            height: 250px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            border-bottom: 2px solid #ccc;
        }

        .bar {
            width: 40px;
            background-color: #1e3a8a;
            border-radius: 5px 5px 0 0;
        }

        .bar1 {
            height: 90px;
        }

        .bar2 {
            height: 140px;
        }

        .bar3 {
            height: 120px;
        }

        .bar4 {
            height: 180px;
        }

        .bar5 {
            height: 150px;
        }

        .bar6 {
            height: 220px;
        }

        .navigation {
            text-align: center;
            margin-top: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #1e3a8a;
            margin: 0 10px;
        }

        @media (max-width: 900px) {
            .kpi-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .kpi-cards {
                grid-template-columns: 1fr;
            }

            .bar {
                width: 25px;
            }
        }
    </style>
</head>

    </div>

            <div class="kpi">
                <h3>Conversion Rate</h3>

                <div class="growth">↑ 3.2% this month</div>
            </div>

            <div class="kpi">
                <h3>Customer Retention</h3>
                <div class="value">92%</div>
                <div class="growth">↑ 5.1% this month</div>
            </div>

        </div>

                <div class="chart">
                    <div class="bar bar1"></div>

                    <div class="bar bar3"></div>
                    <div class="bar bar4"></div>
                    <div class="bar bar5"></div>
                    <div class="bar bar6"></div>
                </div>
