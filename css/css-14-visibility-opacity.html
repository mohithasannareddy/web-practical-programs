
<!DOCTYPE html>
<html>
<head>
    <title>Visibility and Opacity</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .visible {
            background-color: lightgreen;
            padding: 20px;
            margin: 10px;
        }

        .hidden {
            visibility: hidden;
            background-color: red;
            padding: 20px;
            margin: 10px;
        }

        .transparent {
            opacity: 0.3;
            background-color: blue;
            color: white;
            padding: 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Visibility and Opacity</h1>

    <div class="visible">
        Visible Element
    </div>

    <div class="hidden">
        Hidden Element
    </div>

    <div class="transparent">
        Opacity: 0.3
    </div>

</body>
</html>
