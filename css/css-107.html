<!DOCTYPE html>
<html>
<head>
    <title>Area Chart Analytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .chart {
            width: 80%;
            max-width: 800px;
            height: 350px;
            background: white;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .area {
            position: absolute;
            left: 10%;
            bottom: 60px;
            width: 80%;
            height: 230px;
            background: linear-gradient(
                to top,
                rgba(37, 99, 235, 0.4),
                rgba(37, 99, 235, 0.05)
            );

            clip-path: polygon(
                0% 80%,
                20% 60%,
                40% 70%,
                60% 35%,
                80% 50%,
                100% 15%,
                100% 100%,
                0% 100%
            );
        }

        .line {
            position: absolute;
            left: 10%;
            bottom: 60px;
            width: 80%;
            height: 230px;
            border-top: 4px solid #2563eb;
            clip-path: polygon(
                0% 80%,
                20% 60%,
                40% 70%,
                60% 35%,
                80% 50%,
                100% 15%
            );
        }

        .info {
            text-align: center;
            color: #555;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Area Chart Analytics</h1>

    <div class="chart">

        <div class="area"></div>
        <div class="line"></div>

    </div>

    <p class="info">
        Monthly performance represented using an area chart
    </p>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
