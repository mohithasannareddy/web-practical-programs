
<!DOCTYPE html>
<html>
<head>
    <title>Testimonial Card</title>

    <style>
        body {
            font-family: Arial;
            background: #ede9fe;
            padding: 50px;
        }

        .card {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px #aaa;
        }

        .quote {
            font-size: 20px;
            line-height: 1.6;
            color: #475569;
        }

        .author {
            font-weight: bold;
            color: #6d28d9;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="quote">
            “This practical website made learning
            web development much easier.”
        </div>

        <br>

        <div class="author">
            — Student Developer
        </div>

    </div>

</body>
</html>
