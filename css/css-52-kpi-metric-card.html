
<!DOCTYPE html>
<html>
<head>
    <title>KPI Metric Card</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 50px;
        }

        .card {
            width: 300px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 20px #aaa;
        }

        .metric {
            font-size: 38px;
            font-weight: bold;
            color: #0284c7;
        }

        .bar {
            height: 10px;
            background: #ddd;
            border-radius: 10px;
        }

        .progress {
            width: 75%;
            height: 10px;
            background: #0284c7;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h3>Project Completion</h3>

        <div class="metric">75%</div>

        <p>Monthly Target</p>

        <div class="bar">
            <div class="progress"></div>
        </div>

    </div>

</body>
</html>
