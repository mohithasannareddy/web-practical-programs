
<!DOCTYPE html>
<html>
<head>
    <title>CSS Font Properties</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f5f7fb;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            width: 80%;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        /* Font Family */
        .font-family {
            font-family: Georgia, serif;
        }

        /* Font Size */
        .font-size {
            font-size: 25px;
        }

        /* Font Weight */
        .font-weight {
            font-weight: bold;
        }

        /* Font Style */
        .font-style {
            font-style: italic;
        }

        /* Font Variant */
        .font-variant {
            font-variant: small-caps;
        }

        .example {
            padding: 15px;
            margin: 15px 0;
            background-color: #f0f4ff;
            border-radius: 8px;
        }

        nav {
            text-align: center;
            margin: 25px;
        }

        nav a {
            text-decoration: none;
            background-color: black;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: darkblue;
        }

    </style>
</head>

<body>

    <h1>CSS Font Properties</h1>

    <div class="box">

        <div class="example font-family">
            <h2>Font Family</h2>
            <p>This text uses the Georgia font family.</p>
        </div>

        <div class="example font-size">
            <h2>Font Size</h2>
            <p>This text has a larger font size.</p>
        </div>

        <div class="example font-weight">
            <h2>Font Weight</h2>
            <p>This text is bold.</p>
        </div>

        <div class="example font-style">
            <h2>Font Style</h2>
            <p>This text is italic.</p>
        </div>

        <div class="example font-variant">
            <h2>Font Variant</h2>
            <p>This text uses small-caps.</p>
        </div>

    </div>

    <nav>
        <a href="../index.html">ðŸ  Home</a>
        <a href="index.html">ðŸŽ¨ CSS Programs</a>
    </nav>

</body>
</html>
