<!DOCTYPE html>
<html>
<head>
    <title>SaaS Usage Analytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #555;
            font-size: 20px;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0;
        }

        .bar {
            width: 100%;
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 75%;
            background: #2563eb;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>SaaS Usage Analytics</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Active Users</h2>
            <div class="number">2,450</div>
            <p>Monthly Users</p>
        </div>

        <div class="card">
            <h2>Storage Used</h2>
            <div class="number">75%</div>

            <div class="bar">
                <div class="progress"></div>
            </div>

            <p>75 GB of 100 GB</p>
        </div>

        <div class="card">
            <h2>Sessions</h2>
            <div class="number">8,920</div>
            <p>This Month</p>
        </div>

    </div>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
