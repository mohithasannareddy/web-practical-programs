
<!DOCTYPE html>
<html>
<head>
    <title>CSS Cursor Styles</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .box {
            display: inline-block;
            padding: 25px;
            margin: 10px;
            border: 2px solid #333;
            background-color: lightblue;
        }

        .pointer {
            cursor: pointer;
        }

        .wait {
            cursor: wait;
        }

        .help {
            cursor: help;
        }

        .crosshair {
            cursor: crosshair;
        }

        .not-allowed {
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <h1>CSS Cursor Styles</h1>

    <div class="box pointer">Pointer</div>
    <div class="box wait">Wait</div>
    <div class="box help">Help</div>
    <div class="box crosshair">Crosshair</div>
    <div class="box not-allowed">Not Allowed</div>

</body>
</html>
