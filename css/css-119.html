<!DOCTYPE html>
<html>
<head>
    <title>CSS 119 - AI Command Bar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .header {
            background: #4338ca;
            color: white;
            text-align: center;
            padding: 22px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        .command-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .command-box h2 {
            text-align: center;
            margin-top: 0;
            color: #1f2937;
        }

        .command-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border: 2px solid #6366f1;
            border-radius: 14px;
            background: #f8fafc;
        }

        .icon {
            font-size: 24px;
            padding-left: 8px;
        }

        .command-bar input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            padding: 14px 5px;
        }

        .command-bar button {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .command-bar button:hover {
            background: #3730a3;
        }

        .suggestions {
            margin-top: 25px;
        }

        .suggestions h3 {
            color: #374151;
        }

        .suggestion {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 20px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #c7d2fe;
        }

        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            line-height: 1.6;
        }

        .navigation {
            text-align: center;
            margin-top: 25px;
        }

        .navigation a {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .navigation a:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>AI Command Bar</h1>
        <p>CSS Practical Program 119</p>
    </div>

    <div class="container">

        <div class="command-box">

            <h2>🤖 Ask AI Anything</h2>

            <div class="command-bar">
                <div class="icon">✨</div>

                <input
                    type="text"
                    placeholder="Type a command or ask a question..."
                >

                <button>Ask AI</button>
            </div>

            <div class="suggestions">
                <h3>Quick Commands</h3>

                <span class="suggestion">Explain CSS</span>
                <span class="suggestion">Generate HTML</span>
                <span class="suggestion">Fix my code</span>
                <span class="suggestion">Create a website</span>
            </div>

            <div class="info">
                <strong>AI Command Bar</strong><br>
                A command bar provides a simple interface where
                users can type commands, questions, or requests
                for an AI assistant.
            </div>

        </div>

        <div class="navigation">
            <a href="../index.html">🏠 Home</a>
            <a href="index.html">⬅ CSS Programs</a>
        </div>

    </div>

</body>
</html>
