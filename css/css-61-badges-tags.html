
<!DOCTYPE html>
<html>
<head>
    <title>Badges and Tags</title>

    <style>
        body {
            font-family: Arial;
            padding: 50px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 7px 15px;
            margin: 8px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .success {
            background: #dcfce7;
            color: #15803d;
        }

        .warning {
            background: #fef3c7;
            color: #b45309;
        }

        .danger {
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>

<body>

    <h1>Badges & Tags</h1>

    <span class="badge">New</span>

    <span class="badge success">Completed</span>

    <span class="badge warning">Pending</span>

    <span class="badge danger">Failed</span>

</body>
</html>
