
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 85 - Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .registration-box {
            width: 500px;
            max-width: 95%;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .gender {
            display: flex;
            gap: 20px;
        }

        .gender label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gender input {
            width: auto;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        nav {
            text-align: center;
            margin-top: 30px;
        }

        nav a {
            text-decoration: none;
            color: #2563eb;
            margin: 10px;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .registration-box {
                padding: 25px;
            }

            .gender {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="registration-box">

        <h1>📝 Registration Form</h1>

        <form>

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Other
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Course</label>

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="cse">Computer Science</option>
                    <option value="aiml">AI & Machine Learning</option>
                    <option value="ds">Data Science</option>
                    <option value="cyber">Cyber Security</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Register
            </button>

        </form>

    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>

</body>
</html>
