<!DOCTYPE html>
<html>
<head>
    <title>Line Chart Analytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .chart {
            width: 80%;
            max-width: 800px;
            height: 350px;
            background: white;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .line {
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: 80px;
            height: 200px;
            border-left: 2px solid #333;
            border-bottom: 2px solid #333;
        }

        .point {
            width: 15px;
            height: 15px;
            background: #2563eb;
            border-radius: 50%;
            position: absolute;
        }

        .p1 {
            left: 10%;
            bottom: 20%;
        }

        .p2 {
            left: 30%;
            bottom: 45%;
        }

        .p3 {
            left: 50%;
            bottom: 35%;
        }

        .p4 {
            left: 70%;
            bottom: 65%;
        }

        .p5 {
            left: 90%;
            bottom: 80%;
        }

        .info {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        a {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Line Chart Analytics</h1>

    <div class="chart">

        <div class="line">

            <div class="point p1"></div>
            <div class="point p2"></div>
            <div class="point p3"></div>
            <div class="point p4"></div>
            <div class="point p5"></div>

        </div>

    </div>

    <p class="info">
        Monthly user activity from January to May
    </p>

    <div class="buttons">
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
