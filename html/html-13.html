<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>
        body {
            font-family: Arial;
        }

        .box {
            padding: 30px;
            text-align: center;
            background-color: lightblue;
        }

        @media (max-width: 600px) {
            .box {
                background-color: lightgreen;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Webpage</h1>

    <div class="box">
        This webpage adjusts according to screen size.
    </div>

</body>
</html>
